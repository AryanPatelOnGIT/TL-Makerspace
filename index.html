<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Viewport: prevents mobile zoom on form focus (handled by 16px font-size in CSS) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Theme & status bar -->
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tinkerers' Lab" />

    <!-- Preload Comic CAT font so it's ready before first paint — critical on mobile -->
    <link
      rel="preload"
      href="/fonts/Comic_CAT.otf"
      as="font"
      type="font/otf"
      crossorigin="anonymous"
    />

    <title>Tinkerers' Lab — Ahmedabad University</title>
    <meta name="description" content="Makerspace management platform for the Innovation & Tinkering Lab, Ahmedabad University. Book equipment, manage inventory, register projects and more." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js')
        })
      }
    </script>
  </body>
</html>
